name: CI

on:
  push:
    # Gałęzie agenta lecą tu obok `main`, bo PR-kę zakłada `gh` z tokenem
    # zadania, a zdarzenia od `GITHUB_TOKEN` nie budzą kolejnych workflow —
    # `pull_request` by nie wystrzelił i PR-ka wisiałaby bez ani jednego
    # sprawdzenia. Przebieg z `push` przypina się do tego samego commita, więc
    # jego wynik i tak widać w PR-ce.
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  # Cztery sprawdzenia mieszkają w `verify.yml`, bo wołają je także workflow
  # wdrożenia i wydania — tam jako bramka, bez której nic nie wyjeżdża.
  verify:
    uses: ./.github/workflows/verify.yml

  wydania:
    # Serwer aktualizacji stoi na gospodarzu, poza Composem i poza workspace
    # pnpm, więc nie łapie go ani żaden test w repozytorium, ani `smoke.sh`
    # (ten puka przez Caddy'ego do kontenerów). Bez tego zadania jedyne, co
    # pilnuje sprzątania starych wydań na minipc, to czyjaś pamięć — a objawem
    # regresji jest dysk pełny plików `.apk`, zauważony po fakcie.
    name: Serwer aktualizacji (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Zależności serwera są zadeklarowane inline (PEP 723) w samym skrypcie;
      # tutaj trzeba je wymienić z ręki, bo `uv run` bierze je stamtąd tylko
      # wtedy, gdy uruchamia ten plik — a my uruchamiamy pytest.
      - name: Test
        run: >
          uv run --with fastapi --with python-multipart --with uvicorn
          --with httpx2 --with pytest
          pytest deploy/tests -q

  triage:
    # Usługa segregacji zgłoszeń stoi poza workspace pnpm i ma własny zestaw
    # narzędzi, więc idzie osobnym zadaniem — równolegle, bo nie zależy od
    # niczego, co powstaje wyżej.
    name: Segregacja zgłoszeń (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/triage
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
