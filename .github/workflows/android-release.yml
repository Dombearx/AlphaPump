name: Wydanie na Androida

# Wydaje aplikację na minipc, skąd biorą ją telefony — jedną z dwóch dróg.
#
# **Paczka JavaScriptu (OTA).** Zwykłe wydanie: kilka megabajtów, minuty
# zamiast kwadransa gradle'a, aplikacja podmienia się sama. Tędy idzie wszystko,
# co nie rusza warstwy natywnej — czyli prawie każda zmiana.
#
# **Pełny pakiet `.apk`.** Kilkadziesiąt megabajtów do pobrania przeglądarką
# i zainstalowania ręcznie. Potrzebny wyłącznie wtedy, gdy ruszyła warstwa
# natywna: podbicie SDK, nowa zależność z kodem natywnym, zmiana wtyczki
# konfiguracyjnej.
#
# O tym, która to droga, nie decyduje człowiek ani lista ścieżek, tylko odcisk
# warstwy natywnej (`runtimeVersion` z polityką `fingerprint`) porównany z tym,
# który niesie wydanie stojące w tej chwili na minipc. Zadanie `plan` niżej robi
# dokładnie to i nic więcej.
#
# Adres API jest **wkompilowany w wydanie**, a nie ustawiany po instalacji:
# zmienne `EXPO_PUBLIC_*` wchodzą do bundla, a z adresu wyliczają się jeszcze
# wyjątek ATS (iOS) i `networkSecurityConfig` (Android). Dlatego przy ręcznym
# uruchomieniu jest wejściem zadania — pomyłka tutaj daje aplikację, która
# wygląda poprawnie i nie łączy się z niczym.
#
# Po zbudowaniu zadanie wchodzi do NetBirda i wysyła plik na `POST /apk`
# serwera aktualizacji (`deploy/update_server.py`), który kładzie go w katalogu
# oddawanym przez Caddy'ego pod `/alphapump/download` razem z `latest.json`. Telefony
# widzą nowe wydanie przy najbliższym otwarciu aplikacji. Tą samą drogą chodzi
# wdrożenie backendu (`deploy.yml`), więc nie przybywa tu ani jeden nowy kanał.

on:
  # Każde wejście na `main` daje nowe wydanie — inaczej „aktualizuje się samo"
  # znaczyłoby „samo, ale po ręcznym kliknięciu". Ale tylko wtedy, gdy ruszyło
  # się cokolwiek, co wchodzi do pliku `.apk`: zmiana w panelu, w API,
  # w segregacji zgłoszeń albo w `deploy/` nie potrzebuje nowego wydania,
  # a kosztuje kilkanaście minut gradle'a i numer wersji.
  #
  # Rozstrzyga o tym zadanie `zmiany` niżej, a nie filtr `paths` tutaj, choć
  # ten drugi kusi krótkością. `paths` obejmuje **każdy** push, także ten
  # z tagiem — a tag postawiony na commicie, który ruszył wyłącznie `deploy/`,
  # przestałby wtedy wydawać cokolwiek. Osobne zadanie potrafi zapytać
  # o rodzaj zdarzenia, filtr ścieżek nie.
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_url:
        description: 'Adres API w VPN, np. http://domin-server.iron.sq'
        required: true
        type: string
      opublikuj:
        description: 'Wysłać wydanie na minipc po zbudowaniu'
        required: false
        default: true
        type: boolean
      bez_podpisu:
        description: 'Zbuduj mimo braku klucza podpisującego (plik NIE nadaje się do rozdania)'
        required: false
        default: false
        type: boolean
      wymus_apk:
        description: 'Wymuś pełny pakiet .apk, nawet gdy wystarczyłaby paczka JavaScriptu'
        required: false
        default: false
        type: boolean

concurrency:
  group: android-release-${{ github.ref }}
  # Przy serii wejść na `main` liczy się wyłącznie ostatnie — wcześniejsze i tak
  # zostałyby natychmiast zastąpione. Wydania z tagu nie przerywamy: ono ma
  # trafić do wydania w GitHubie, a nie zniknąć, bo ktoś zdążył wypchnąć commit.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Wydanie z tagu dokleja plik do wydania w GitHubie; poza tagiem zadanie niczego
# w repozytorium nie zmienia.
permissions:
  contents: write

jobs:
  # Bramka przed gradle'em: czy w tym wejściu na `main` ruszyło się cokolwiek,
  # co trafia do pliku `.apk`. Wydanie z tagu i uruchomienie ręczne przechodzą
  # tędy bez pytania — tam wydanie jest właśnie tym, po co ktoś przyszedł.
  zmiany:
    name: Czy wydanie jest potrzebne
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      wydawac: ${{ steps.sprawdz.outputs.wydawac }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Porównujemy z commitem sprzed pushu, a ten w płytkiej kopii nie
          # istnieje.
          fetch-depth: 0

      - name: Sprawdź, czy ruszyło się coś z aplikacji
        id: sprawdz
        env:
          PRZED: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" != "push" ] || [ "$GITHUB_REF_TYPE" = "tag" ]; then
            echo "wydanie z tagu albo uruchomienie ręczne — buduję bez pytania"
            echo "wydawac=tak" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Pierwsze wejście na gałąź, push wymuszony albo commit sprzed pushu
          # przepadły — nie mamy z czym porównać. Wtedy budujemy: cicho
          # pominięte wydanie jest droższe niż kilkanaście minut gradle'a.
          if [ -z "$PRZED" ] || ! git cat-file -e "${PRZED}^{commit}" 2>/dev/null; then
            echo "brak commita odniesienia ($PRZED) — buduję na wszelki wypadek"
            echo "wydawac=tak" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          zmienione=$(git diff --name-only "$PRZED" "$GITHUB_SHA")
          echo "zmienione pliki:"
          printf '%s\n' "$zmienione" | sed 's/^/  /'

          # Wszystko, co wchodzi do wydania: sama aplikacja, pakiety
          # współdzielone, które Metro wciąga do bundla, manifesty decydujące
          # o wersjach zależności i ten workflow. Lista jest szersza niż
          # `apps/mobile`, bo `pnpm --filter "@alphapump/db..."` buduje też
          # `packages/core`; obejmuje całe `packages/`, żeby dołożenie
          # aplikacji mobilnej nowej zależności nie wymagało pamiętania o tym
          # pliku.
          if printf '%s\n' "$zmienione" | grep -qE '^(apps/mobile/|packages/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|tsconfig\.base\.json$|turbo\.json$|\.npmrc$|\.nvmrc$|\.github/workflows/android-release\.yml$)'; then
            echo "wydawac=tak" >> "$GITHUB_OUTPUT"
          else
            echo "nic z aplikacji się nie zmieniło — pomijam wydanie"
            echo "wydawac=nie" >> "$GITHUB_OUTPUT"
          fi

  # Odcisk warstwy natywnej dla tego commita i decyzja, co z niego wynika.
  #
  # Odcisk liczy `expo-updates` z konfiguracji i z wtyczek — ta sama wartość,
  # którą aplikacja poda w nagłówku, pytając o manifest. Porównujemy ją
  # z odciskiem wydania stojącego na minipc, bo to on mówi, co telefony mają
  # **zainstalowane**: równe odciski znaczą, że paczka JavaScriptu wystarczy.
  #
  # Brak odpowiedzi z minipc znaczy „nie wiem" i wypada na `.apk`. Wydanie
  # pełne jest wolniejsze, ale zawsze poprawne; paczka wydana pod nieznany
  # odcisk kończy się aplikacją, która nie wstaje.
  plan:
    name: Odcisk warstwy natywnej
    needs: zmiany
    if: needs.zmiany.outputs.wydawac == 'tak'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_SIGN_IN_ENABLED: ${{ vars.EXPO_PUBLIC_GOOGLE_SIGN_IN_ENABLED || 'false' }}
      EXPO_NO_TELEMETRY: 1
      DO_NOT_TRACK: 1

    outputs:
      odcisk: ${{ steps.odcisk.outputs.odcisk }}
      wydanie: ${{ steps.decyzja.outputs.wydanie }}

    steps:
      - name: Sprawdź adres API
        run: |
          [ -n "${EXPO_PUBLIC_API_URL}" ] || {
            echo "::error::Brak adresu API. Uruchom zadanie ręcznie z polem api_url albo ustaw zmienną repozytorium EXPO_PUBLIC_API_URL." >&2
            exit 1
          }

      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Adres API wchodzi do konfiguracji, a konfiguracja wchodzi do odcisku —
      # więc odcisk liczony z innym adresem byłby innym odciskiem. Zmienne są
      # w `env:` zadania z tego właśnie powodu, a nie dla wygody.
      - name: Policz odcisk
        id: odcisk
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          odcisk="$(npx expo-updates runtimeversion:resolve --platform android | jq -r .runtimeVersion)"
          [ -n "$odcisk" ] && [ "$odcisk" != "null" ] || {
            echo "::error::Nie udało się policzyć odcisku warstwy natywnej." >&2
            exit 1
          }
          echo "odcisk=${odcisk}" >> "$GITHUB_OUTPUT"
          echo "Odcisk tego commita: ${odcisk}"

      - name: Wejdź do sieci NetBird
        uses: hackiron/public-actions/netbird-connect@main
        with:
          setup-key: ${{ secrets.NETBIRD_ACCESS_KEY }}
          hostname: github-actions-plan-alphapump
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Rozstrzygnij, czy potrzebny jest nowy pakiet
        id: decyzja
        env:
          ALPHAPUMP_UPDATE_SERVER_URL: ${{ secrets.ALPHAPUMP_UPDATE_SERVER_URL }}
          ODCISK: ${{ steps.odcisk.outputs.odcisk }}
          WYMUS_APK: ${{ inputs.wymus_apk || false }}
        run: |
          set -euo pipefail
          base="${ALPHAPUMP_UPDATE_SERVER_URL%/update}"

          # Wyjście awaryjne, i jedyne, jakie jest.
          #
          # Odcisk rozstrzyga poprawnie o tym, czy paczka **pasuje** do warstwy
          # natywnej — ale nie o tym, czy telefon umie ją uruchomić. Gdy paczki
          # przestają wstawać, telefon zostaje na kodzie z pakietu, a każde
          # kolejne wydanie idzie paczką, bo odcisk dalej się zgadza. Bez tego
          # przełącznika nie ma jak dostarczyć czegokolwiek: droga naprawcza
          # prowadziłaby przez sztuczną zmianę warstwy natywnej albo skasowanie
          # wydania na minipc, żeby `GET /apk` oddał 404.
          if [ "${WYMUS_APK}" = "true" ]; then
            echo "Wymuszono pełny pakiet — pomijam porównanie odcisków."
            echo "wydanie=apk" >> "$GITHUB_OUTPUT"
            echo "powod=wymuszone ręcznie przy uruchomieniu zadania" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Czekamy, aż minipc będzie osiągalny, **zanim** o cokolwiek zapytamy.
          #
          # Bez tego kroku zapytanie leciało natychmiast po wejściu do NetBirda,
          # zanim zdążyła się rozejść nazwa hosta — i kończyło się w kilkadziesiąt
          # milisekund nieudanym rozwiązaniem nazwy. Ponieważ nieudane zapytanie
          # wyglądało tak samo jak „nie ma jeszcze wydania", **każde** wydanie
          # szło pełnym pakietem, bez śladu w logu mówiącego dlaczego. Kroki
          # publikujące niżej mają tę pętlę od początku; tutaj jej brakowało.
          osiagalny=nie
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 -o /dev/null "${base}/health"; then
              osiagalny=tak
              break
            fi
            echo "Czekam na serwer aktualizacji (${i}/12)..."
            sleep 5
          done

          # `GET /apk` oddaje manifest wydania stojącego na minipc — to on mówi,
          # co ludzie mają **zainstalowane**. 404 znaczy „nikt jeszcze nic nie
          # wydał"; brak pola `runtimeVersion` znaczy wydanie sprzed wprowadzenia
          # odcisków. Wszystkie trzy przypadki kończą się pełnym pakietem, ale
          # **każdy mówi o sobie osobno**: cicha porażka tego kroku wyłącza OTA
          # na zawsze i nie ma tego po czym poznać.
          poprzedni=""
          if [ "$osiagalny" = "tak" ]; then
            kod="$(curl -sS --max-time 30 -o /tmp/wydane.json -w '%{http_code}' "${base}/apk" || echo 000)"
            if [ "$kod" = "200" ]; then
              poprzedni="$(jq -r '.runtimeVersion // ""' /tmp/wydane.json)"
              powod="$([ -n "$poprzedni" ] && echo "odcisk odczytany" || echo "wydanie na minipc nie niesie odcisku (sprzed tej zmiany)")"
            elif [ "$kod" = "404" ]; then
              powod="na minipc nie ma jeszcze żadnego wydania"
            else
              powod="serwer aktualizacji odpowiedział ${kod} na GET /apk"
            fi
          else
            powod="minipc nieosiągalny — NetBird nie zdążył albo serwer nie odpowiada"
          fi

          echo "Odcisk tego commita:      ${ODCISK}"
          echo "Odcisk wydania na minipc: ${poprzedni:-(brak)} — ${powod}"

          if [ -n "$poprzedni" ] && [ "$poprzedni" = "$ODCISK" ]; then
            echo "Warstwa natywna bez zmian — wystarczy paczka JavaScriptu."
            echo "wydanie=ota" >> "$GITHUB_OUTPUT"
          else
            echo "Potrzebny pełny pakiet."
            echo "wydanie=apk" >> "$GITHUB_OUTPUT"
          fi

          # Powód trafia do podsumowania, żeby „czemu znowu pełny pakiet?"
          # dało się odpowiedzieć z listy przebiegów, bez wchodzenia w logi.
          echo "powod=${powod}" >> "$GITHUB_OUTPUT"

          # Nieosiągalny minipc to nie jest normalny stan i nie ma prawa
          # przechodzić niezauważony — wydanie się uda, ale z ostrzeżeniem.
          if [ "$osiagalny" != "tak" ]; then
            echo "::warning::Nie dobiłem się do serwera aktualizacji, więc wydanie idzie pełnym pakietem mimo że mogła wystarczyć paczka."
          fi

      - name: Podsumowanie
        run: |
          {
            echo "### Plan wydania"
            echo
            echo "- odcisk: \`${{ steps.odcisk.outputs.odcisk }}\`"
            echo "- droga: **${{ steps.decyzja.outputs.wydanie }}**"
            echo "- podstawa decyzji: ${{ steps.decyzja.outputs.powod }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Szybka ścieżka: sam JavaScript. Bez gradle'a, bez Javy, bez klucza
  # podpisującego — bo nie powstaje tu nic, co system miałby instalować.
  ota:
    name: Wydanie paczki JavaScriptu
    needs: [zmiany, plan]
    if: needs.plan.outputs.wydanie == 'ota'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_GOOGLE_SIGN_IN_ENABLED: ${{ vars.EXPO_PUBLIC_GOOGLE_SIGN_IN_ENABLED || 'false' }}
      PUBLIKUJ: ${{ github.event_name != 'workflow_dispatch' || inputs.opublikuj }}
      ODCISK: ${{ needs.plan.outputs.odcisk }}
      # Odcisk **przypięty**, nie liczony ponownie. Liczenie go drugi raz
      # w innym zadaniu jest zaproszeniem do rozjazdu — a paczka opisana cudzą
      # warstwą natywną to kod zbudowany dla innego pakietu, czyli awaria,
      # której nie da się już naprawić zdalnie.
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.plan.outputs.odcisk }}
      EXPO_NO_TELEMETRY: 1
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Metro rozwiązuje `@alphapump/core` i `@alphapump/db` do ich `dist/`,
      # więc pakiety muszą być zbudowane, zanim zacznie pakować bundle.
      - name: Zbuduj pakiety współdzielone
        run: pnpm --filter "@alphapump/db..." run build

      - name: Zbuduj paczkę
        run: pnpm --filter @alphapump/mobile run build

      - name: Spakuj wynik eksportu
        run: tar -czf export.tar.gz -C apps/mobile/dist .

      - uses: actions/upload-artifact@v4
        with:
          name: alphapump-ota-${{ needs.plan.outputs.odcisk }}-${{ github.run_number }}
          path: export.tar.gz
          retention-days: 30

      - name: Wejdź do sieci NetBird
        if: ${{ env.PUBLIKUJ == 'true' }}
        uses: hackiron/public-actions/netbird-connect@main
        with:
          setup-key: ${{ secrets.NETBIRD_ACCESS_KEY }}
          hostname: github-actions-ota-alphapump
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Wyślij paczkę na minipc
        if: ${{ env.PUBLIKUJ == 'true' }}
        env:
          ALPHAPUMP_UPDATE_SERVER_URL: ${{ secrets.ALPHAPUMP_UPDATE_SERVER_URL }}
          # Dowód, że to wydanie idzie stąd, a nie od kogokolwiek innego w VPN.
          # Przy paczce JavaScriptu jest to jedyny taki dowód: pakiet `.apk`
          # broni się jeszcze podpisem sprawdzanym przez Androida, paczka nie ma
          # czym — aplikacja uruchamia to, co serwer poda dla jej odcisku.
          ALPHAPUMP_PUBLISH_TOKEN: ${{ secrets.ALPHAPUMP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          base="${ALPHAPUMP_UPDATE_SERVER_URL%/update}"

          [ -n "${ALPHAPUMP_PUBLISH_TOKEN}" ] || {
            echo "::error::Brak sekretu ALPHAPUMP_PUBLISH_TOKEN — serwer aktualizacji odrzuci wydanie." >&2
            exit 1
          }

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "${base}/health" && break
            echo "Czekam na serwer aktualizacji..."
            sleep 10
            [ "$i" -lt 30 ] || { echo "::error::Serwer aktualizacji nie odpowiedział przez 5 minut"; exit 1; }
          done

          # Ten sam powód co przy `POST /apk`: `/update` robi `git pull`, ale nie
          # przeładowuje samego siebie, więc po wdrożeniu dokładającym trasę
          # serwer odpowiada na `/health` jak gdyby nigdy nic i zwraca 404 na
          # nową trasę — co wygląda na błąd wydania, nie na nieodświeżony proces.
          if ! curl -fsS --max-time 20 "${base}/openapi.json" | jq -e '.paths."/ota".post' >/dev/null; then
            echo "::error::Serwer aktualizacji nie zna trasy POST /ota — chodzi na kodzie sprzed wdrożenia. Na minipc: sudo systemctl restart alphapump-update-server"
            exit 1
          fi

          curl -fsS --max-time 300 \
            -H "Authorization: Bearer ${ALPHAPUMP_PUBLISH_TOKEN}" \
            -F "runtimeVersion=${ODCISK}" \
            -F "platform=android" \
            -F "export=@export.tar.gz;type=application/gzip" \
            "${base}/ota"

      - name: Podsumowanie
        run: |
          {
            echo "### Paczka JavaScriptu"
            echo
            echo "- adres API: \`${EXPO_PUBLIC_API_URL}\`"
            echo "- odcisk warstwy natywnej: \`${ODCISK}\`"
            echo "- rozmiar: $(du -h export.tar.gz | cut -f1)"
            if [ "${PUBLIKUJ}" = "true" ]; then
              echo "- na minipc: wysłane, telefony pobiorą ją przy najbliższym otwarciu aplikacji"
            else
              echo "- na minipc: pominięte"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  apk:
    name: Budowa pliku APK
    needs: [zmiany, plan]
    if: needs.plan.outputs.wydanie == 'apk'
    runs-on: ubuntu-latest
    # Udane wydania mieszczą się w kwadransie–dwudziestu minutach, a od
    # zawężenia architektur do jednej powinny w mniej. Limit jest więc ciasny
    # **celowo**: gradle po padnięciu z braku pamięci potrafi nie wyjść wcale,
    # a przy limicie 90 minut kosztowało to 79 minut wiszenia i wyglądało na
    # zawieszone CI zamiast na błąd budowy. Lepiej dowiedzieć się szybko.
    timeout-minutes: 45

    env:
      # Poza ręcznym uruchomieniem adres bierze się ze zmiennej repozytorium
      # (Settings → Variables), bo ani tag, ani push nie mają jak go przekazać.
      EXPO_PUBLIC_API_URL: ${{ inputs.api_url || vars.EXPO_PUBLIC_API_URL }}
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      # Logowanie Google jest domyślnie wyłączone i wymaga **dwóch** zgód:
      # tej zmiennej tutaj i `GOOGLE_SIGN_IN_ENABLED` w `deploy/.env`. Włączenie
      # samego wydania dałoby przycisk, którego serwer nie obsłuży. Pamiętaj też
      # o odcisku SHA-1 klucza podpisującego w Google Cloud — bez niego natywny
      # Sign-In kończy się `DEVELOPER_ERROR` dopiero na telefonie.
      EXPO_PUBLIC_GOOGLE_SIGN_IN_ENABLED: ${{ vars.EXPO_PUBLIC_GOOGLE_SIGN_IN_ENABLED || 'false' }}
      # Numer wydania widziany przez system Android. Musi rosnąć między
      # wydaniami, inaczej telefon odmówi aktualizacji. To także numer, po
      # którym aplikacja rozpoznaje, że `latest.json` opisuje coś nowszego.
      ANDROID_VERSION_CODE: ${{ github.run_number }}
      # Odcisk warstwy natywnej policzony w zadaniu `plan`. Wchodzi do
      # `latest.json`, dzięki czemu **następne** wydanie ma z czym porównać swój
      # i rozstrzygnąć, czy wystarczy paczka JavaScriptu.
      ODCISK: ${{ needs.plan.outputs.odcisk }}
      # Ten sam odcisk **przypięty** dla budowy, i to jest konieczne, a nie
      # ostrożnościowe: `plan` liczy go w projekcie zarządzanym, a tutaj
      # `prebuild` tworzy katalog `android/` i odcisk zaczyna się liczyć z pliku
      # natywnego projektu — czyli wychodzi inny. Pakiet niósłby wtedy jedną
      # wartość, `latest.json` drugą, a następne wydanie porównałoby się z tą
      # drugą i uznało, że wystarczy paczka. Telefony dostałyby paczkę zbudowaną
      # dla warstwy, której nie mają.
      EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.plan.outputs.odcisk }}
      # Ręczne uruchomienie może chcieć samego pliku, bez rozdawania go grupie.
      # Zapis przez `github.event_name` jest celowy: dla `push` `inputs.*` jest
      # pustym napisem, a ten w porównaniu z wartością logiczną wychodzi na
      # fałsz — czyli publikacja po cichu by nie zadziałała.
      PUBLIKUJ: ${{ github.event_name != 'workflow_dispatch' || inputs.opublikuj }}
      # `secrets` nie jest dostępne w warunkach `if:` kroków (GitHub odrzuca
      # cały plik na etapie parsowania: „Unrecognized named-value: 'secrets'").
      # Stąd ten sam sekret trafia najpierw tutaj, do `env`, gdzie jest
      # dozwolony, a warunki niżej czytają już `env.HAS_SIGNING_KEY`.
      HAS_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      TURBO_TELEMETRY_DISABLED: 1
      DO_NOT_TRACK: 1

    steps:
      - name: Sprawdź adres API
        run: |
          [ -n "${EXPO_PUBLIC_API_URL}" ] || {
            echo "::error::Brak adresu API. Uruchom zadanie ręcznie z polem api_url albo ustaw zmienną repozytorium EXPO_PUBLIC_API_URL." >&2
            exit 1
          }
          echo "Buduję wydanie wskazujące na ${EXPO_PUBLIC_API_URL}"

      # Klucz podpisujący jest wymagany, a nie zalecany, i to jest zmiana
      # świadoma. Bez sekretu gradle podpisuje wydanie kluczem deweloperskim
      # z szablonu React Native — jego klucz prywatny jest publicznie znany,
      # a odcisk (`FA:C6:17:45…`) ten sam we wszystkich projektach na świecie.
      # Dopóki APK się rozdawało ręcznie, było to brzydkie; przy aktualizacji
      # pobieranej po HTTP jest to otwarta furtka: dowolny plik podpisany tym
      # samym publicznym kluczem zainstaluje się **na miejsce** aplikacji.
      # Drugi powód jest praktyczny — podpisu nie da się później zmienić bez
      # odinstalowania aplikacji na każdym telefonie.
      - name: Sprawdź klucz podpisujący
        if: ${{ env.HAS_SIGNING_KEY != 'true' && inputs.bez_podpisu != true }}
        run: |
          cat >&2 <<'KONIEC'
          ::error::Brak sekretu ANDROID_KEYSTORE_BASE64 — wydanie zostałoby podpisane publicznie znanym kluczem deweloperskim.

          Klucz robi się raz i zostaje na zawsze:

            keytool -genkeypair -v -keystore alphapump.keystore -alias alphapump \
              -keyalg RSA -keysize 4096 -validity 10000

            base64 -w0 alphapump.keystore    # → sekret ANDROID_KEYSTORE_BASE64

          Do sekretów repozytorium wchodzą jeszcze ANDROID_KEYSTORE_PASSWORD,
          ANDROID_KEY_ALIAS i ANDROID_KEY_PASSWORD. Sam plik .keystore trzeba
          zachować poza repozytorium — bez niego nie da się wydać aktualizacji
          do już zainstalowanej aplikacji.

          Do zbudowania pliku wyłącznie na próbę: uruchom zadanie ręcznie
          z zaznaczonym `bez_podpisu`.
          KONIEC
          exit 1

      - uses: actions/checkout@v4

      # Wersja dla człowieka. Poza tagiem zostaje ta z `app.config.js`, a
      # rozróżnia wydania numer `versionCode` pokazywany obok niej — zmienna
      # jest więc ustawiana tylko wtedy, gdy naprawdę ma co powiedzieć.
      # (Pusta wartość jest tu bezpieczna: `config/env.js` czyta ją jak brak.)
      - name: Ustal wersję dla człowieka
        if: ${{ github.ref_type == 'tag' }}
        run: echo "APP_VERSION_NAME=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Metro rozwiązuje `@alphapump/core` i `@alphapump/db` do ich `dist/`,
      # więc pakiety muszą być zbudowane, zanim gradle zacznie pakować bundle.
      - name: Zbuduj pakiety współdzielone
        run: pnpm --filter "@alphapump/db..." run build

      # Projekt natywny nie jest w repozytorium — źródłem prawdy jest
      # `app.config.js` i wtyczki. `prebuild` odtwarza go od zera przy każdym
      # wydaniu, razem z wyjątkiem cleartext wyliczonym z adresu API.
      - name: Wygeneruj projekt natywny
        run: pnpm --filter @alphapump/mobile run prebuild

      - name: Zbuduj wydanie
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      # Podpis zakładamy `apksigner`-em **po** gradle'u, zamiast wstrzykiwać
      # konfigurację podpisu do wygenerowanego `build.gradle`. Plik ten powstaje
      # na nowo przy każdym `prebuild`, więc każda jego modyfikacja w CI byłaby
      # łataniem wyniku generatora. `apksigner` zastępuje podpis istniejący, co
      # jest dokładnie tym, czego tu potrzeba.
      - name: Podpisz własnym kluczem
        if: ${{ env.HAS_SIGNING_KEY == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"

          build_tools="$(ls -d "${ANDROID_HOME}/build-tools"/* | sort -V | tail -1)"
          "${build_tools}/apksigner" sign \
            --ks "$keystore" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          "${build_tools}/apksigner" verify --print-certs \
            apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      # `latest.json` powstaje **tu**, obok pliku, który opisuje. Liczony gdzie
      # indziej rozjechałby się z nim przy pierwszej pomyłce — a rozjazd widać
      # dopiero na telefonie, jako aktualizację, której nie da się pobrać.
      - name: Opisz wydanie
        id: plik
        run: |
          set -euo pipefail
          mkdir -p wydanie
          nazwa="alphapump-${ANDROID_VERSION_CODE}.apk"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "wydanie/${nazwa}"
          cd wydanie

          # Suma kontrolna jedzie razem z plikiem: telefony pobierają go po HTTP
          # wewnątrz VPN i to jedyny sposób sprawdzenia, że doszedł w całości.
          # SHA-256 sprawdza minipc przy przyjmowaniu pliku, MD5 — aplikacja po
          # pobraniu, bo tę sumę `expo-file-system` liczy natywnie.
          sha256sum "${nazwa}" > "${nazwa}.sha256"

          # `runtimeVersion` jest tu **nie** dla telefonów — te odczytują swój
          # odcisk z własnego pakietu. Jest dla następnego przebiegu tego
          # workflow: to jedyne miejsce, w którym zapisany jest odcisk wydania,
          # które ludzie naprawdę mają zainstalowane, a bez niego zadanie `plan`
          # nie ma z czym porównać i każde wydanie musiałoby iść pełnym pakietem.
          jq -n \
            --argjson versionCode "${ANDROID_VERSION_CODE}" \
            --arg versionName "${APP_VERSION_NAME:-$(jq -r .version ../apps/mobile/package.json)}" \
            --arg file "${nazwa}" \
            --argjson size "$(stat -c%s "${nazwa}")" \
            --arg md5 "$(md5sum "${nazwa}" | cut -d' ' -f1)" \
            --arg sha256 "$(cut -d' ' -f1 "${nazwa}.sha256")" \
            --arg runtimeVersion "${ODCISK}" \
            --arg releasedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg notes "$(git -C .. log -1 --pretty=%s)" \
            '{versionCode:$versionCode, versionName:$versionName, file:$file, size:$size, md5:$md5, sha256:$sha256, runtimeVersion:$runtimeVersion, releasedAt:$releasedAt, notes:$notes}' \
            > latest.json

          cat latest.json
          echo "nazwa=${nazwa}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plik.outputs.nazwa }}
          path: wydanie/
          retention-days: 30

      # ---------------------------------------------------------- na minipc

      - name: Wejdź do sieci NetBird
        if: ${{ env.PUBLIKUJ == 'true' }}
        uses: hackiron/public-actions/netbird-connect@main
        with:
          setup-key: ${{ secrets.NETBIRD_ACCESS_KEY }}
          hostname: github-actions-release-alphapump
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Wyślij wydanie na minipc
        if: ${{ env.PUBLIKUJ == 'true' }}
        env:
          ALPHAPUMP_UPDATE_SERVER_URL: ${{ secrets.ALPHAPUMP_UPDATE_SERVER_URL }}
          ALPHAPUMP_PUBLISH_TOKEN: ${{ secrets.ALPHAPUMP_PUBLISH_TOKEN }}
          NAZWA: ${{ steps.plik.outputs.nazwa }}
        run: |
          set -euo pipefail
          # Sekret trzyma pełny adres z `/update` na końcu — pozostałe trasy
          # tego samego serwera wyliczamy z niego, żeby nie mnożyć sekretów.
          base="${ALPHAPUMP_UPDATE_SERVER_URL%/update}"

          [ -n "${ALPHAPUMP_PUBLISH_TOKEN}" ] || {
            echo "::error::Brak sekretu ALPHAPUMP_PUBLISH_TOKEN — serwer aktualizacji odrzuci wydanie." >&2
            exit 1
          }

          for i in $(seq 1 30); do
            curl -fsS -o /dev/null "${base}/health" && break
            echo "Czekam na serwer aktualizacji..."
            sleep 10
            [ "$i" -lt 30 ] || { echo "::error::Serwer aktualizacji nie odpowiedział przez 5 minut"; exit 1; }
          done

          # Czy serwer w ogóle zna trasę, na którą zaraz wyślemy plik.
          #
          # `/update` robi `git pull`, ale **nie przeładowuje samego siebie**:
          # usługa systemd trzyma w pamięci kod sprzed aktualizacji repozytorium.
          # Po wdrożeniu, które dokłada nową trasę, serwer odpowiada więc na
          # `/health` jak gdyby nigdy nic i zwraca 404 na `POST /apk` — a to
          # wygląda na błąd wydania, nie na nieodświeżony proces. Pytamy zatem
          # o opis API, gdzie 404 nieistniejącej trasy odróżnia się od 404
          # „jeszcze nie ma wydania".
          if ! curl -fsS --max-time 20 "${base}/openapi.json" | jq -e '.paths."/apk".post' >/dev/null; then
            echo "::error::Serwer aktualizacji nie zna trasy POST /apk — chodzi na kodzie sprzed wdrożenia. Na minipc: sudo systemctl restart alphapump-update-server"
            exit 1
          fi

          # `-F "pole=<plik"` wysyła **zawartość** pliku jako wartość pola,
          # `-F "pole=@plik"` — sam plik jako załącznik. Manifest jedzie więc
          # pierwszym zapisem, a APK drugim.
          curl -fsS --max-time 600 \
            -H "Authorization: Bearer ${ALPHAPUMP_PUBLISH_TOKEN}" \
            -F "manifest=<wydanie/latest.json" \
            -F "apk=@wydanie/${NAZWA};type=application/vnd.android.package-archive" \
            "${base}/apk"

      # Wydanie z tagu dostaje plik doklejony do wydania w GitHubie — żeby dało
      # się do niego wrócić po wygaśnięciu artefaktu i po tym, jak minipc
      # wyrzuci starsze pliki, robiąc miejsce nowszym.
      - name: Dołącz do wydania
        if: ${{ github.ref_type == 'tag' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 \
            || gh release create "$tag" --title "$tag" --notes "Wydanie aplikacji na Androida."
          gh release upload "$tag" wydanie/* --clobber

      - name: Podsumowanie
        run: |
          {
            echo "### Wydanie ${{ steps.plik.outputs.nazwa }}"
            echo
            echo "- adres API: \`${EXPO_PUBLIC_API_URL}\`"
            echo "- versionCode: \`${ANDROID_VERSION_CODE}\`"
            echo "- odcisk warstwy natywnej: \`${ODCISK}\`"
            echo "- podpis: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'własny klucz' || '⚠️ klucz deweloperski — pliku nie rozdawaj' }}"
            if [ "${PUBLIKUJ}" = "true" ]; then
              echo "- na minipc: wysłane, telefony zobaczą je przy najbliższym otwarciu aplikacji"
            else
              echo "- na minipc: pominięte (artefakt zadania trzeba wgrać ręcznie)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
