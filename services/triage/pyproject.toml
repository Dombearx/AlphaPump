[project]
name = "alphapump-triage"
version = "0.1.0"
description = "Segregacja zgłoszeń zwrotnych: klasyfikacja LLM-em, issue na GitHubie, bot na Discordzie."
requires-python = ">=3.12"
dependencies = [
  "discord.py>=2.4,<3",
  "httpx>=0.27,<1",
  "apscheduler>=3.10,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
alphapump-triage = "alphapump_triage.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alphapump_triage"]

[tool.pytest.ini_options]
# `asyncio_mode = auto` zwalnia z dekorowania każdego testu — praktycznie cała
# logika tej usługi jest asynchroniczna, więc marker byłby szumem w każdym pliku.
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
