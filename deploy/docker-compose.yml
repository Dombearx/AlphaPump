# Stos AlphaPump na minipc.
#
# Trzy kontenery: baza, API i warstwa wejściowa (Caddy z wpieczonym panelem).
# Uruchomienie i aktualizacja są opisane w README, w sekcji „Wdrożenie".
#
# Zmienne wchodzą z pliku `deploy/.env` (wzór: `.env.example`). Compose czyta go
# sam, bo leży obok tego pliku. Zapis `${X:?…}` znaczy „bez tej zmiennej nie
# startujemy" — brakujący sekret ma zatrzymać wdrożenie tutaj, a nie objawić się
# jako dziwne zachowanie sesji.

name: alphapump

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-alphapump}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-alphapump}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Brak `ports:` jest celowy. Baza jest osiągalna wyłącznie w sieci Compose;
    # wystawienie 5432 na minipc oznaczałoby port z pełną historią treningową
    # grupy, otwarty na LAN, bez żadnego powodu.
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "${POSTGRES_USER:-alphapump}" -d "${POSTGRES_DB:-alphapump}"']
      interval: 5s
      timeout: 5s
      retries: 24

  api:
    build:
      # Kontekst to katalog główny repozytorium: obraz buduje się z tych samych
      # źródeł, które przechodzą CI.
      context: ..
      dockerfile: deploy/Dockerfile.api
    image: alphapump/api:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-alphapump}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-alphapump}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?ustaw BETTER_AUTH_SECRET w deploy/.env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?ustaw BETTER_AUTH_URL — adres, pod którym stos widać w VPN}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-alphapump://}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Wartości domyślne są tu powtórzone za `apps/api/src/config.ts`, bo Compose
      # nie umie „nie ustawić" zmiennej: pusty napis przeszedłby do kontenera
      # i odbiłby się o walidację, która wymaga wartości niepustej.
      LLM_ENABLED: ${LLM_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-qwen/qwen3-embedding-0.6b}
      RERANKER_MODEL: ${RERANKER_MODEL:-google/gemini-2.5-flash}
      RERANKER_ENABLED: ${RERANKER_ENABLED:-true}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-8000}
      # Ścieżka w kontenerze jest stała — host decyduje, co się pod nią kryje,
      # przez wolumin niżej. Aplikacja nie musi znać żadnej z tych decyzji.
      FEEDBACK_DIR: /data/feedback
    # Brak `ports:` również tutaj: do API wchodzi się przez Caddy'ego, żeby panel
    # i API miały jedno pochodzenie. Kopie zapasowe wołają CLI przez
    # `docker compose exec`, więc też nie potrzebują portu.
    volumes:
      # Zgłoszenia zwrotne z aplikacji — jeden plik JSON na zgłoszenie, czytelny
      # `cat`-em na minipc. Ten sam wzorzec co `APK_DIR` u `web` niżej: katalog
      # gospodarza wchodzi z `deploy/.env`, żeby przetrwał `docker compose down`.
      - ${FEEDBACK_DIR:-./feedback}:/data/feedback
    healthcheck:
      # Obraz jest oparty na `node:alpine` i nie ma `curl`-a ani `wget`-a
      # z HTTP-em — a Node ma `fetch` w standardzie. `/health` odpytuje bazę,
      # więc „zdrowy" znaczy tu naprawdę „gotowy przyjmować żądania".
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      # Pierwszy start uruchamia migracje, więc bywa wyraźnie dłuższy od kolejnych.
      start_period: 60s
      retries: 6

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: alphapump/web:local
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    # Adres nasłuchu jest wyciągnięty do zmiennej, bo to jedyne miejsce, w którym
    # stos dotyka sieci gospodarza. `0.0.0.0` odpowiada decyzji z dokumentu stacku
    # (sieć lokalna minipc jest traktowana jako zaufana); wpisanie tu adresu
    # z interfejsu NetBird zawęża dostęp do samego VPN-u.
    ports:
      - '${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80'
    volumes:
      # Dystrybucja aplikacji na Androida. Plik `.apk` położony w tym katalogu
      # jest do pobrania pod `/pobierz/<nazwa>` — czyli tam, gdzie telefony i tak
      # sięgają po API, bez zakładania nikomu konta w GitHubie i bez wystawiania
      # czegokolwiek poza VPN. Caddy serwuje go zwykłym `file_server`, więc żadna
      # zmiana w `Caddyfile` nie jest do tego potrzebna.
      - ${APK_DIR:-./apk}:/srv/pobierz:ro
    healthcheck:
      # `wget -q -O -` zamiast `--spider`: obraz Caddy'ego stoi na Alpine,
      # a wget z busyboksa ma krótkie flagi zawsze, długie zależnie od budowy.
      # Żądanie idzie przez Caddy'ego do `/health`, więc „zdrowy" znaczy tu
      # także „proxy do API działa", a nie tylko „proces słucha na porcie".
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 10s
      timeout: 5s
      retries: 6

  triage:
    # Segregacja zgłoszeń zwrotnych — patrz `services/triage`. Nie jest częścią
    # aplikacji: nie dotyka bazy, nie wystawia portu i nie obsługuje żadnego
    # żądania od telefonu. Stoi tu, bo tu leżą zgłoszenia, a katalog z nimi jest
    # na dysku minipc, nie w bazie.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.triage
    image: alphapump/triage:local
    restart: unless-stopped
    # Brak `depends_on: api`: usługa czyta pliki, a nie API. Awaria backendu ma
    # wstrzymać nowe zgłoszenia, a nie przegląd tych, które już przyszły.
    environment:
      # Ścieżki wewnątrz kontenera są stałe; o to, co się pod nimi kryje, dbają
      # woluminy niżej — ten sam wzorzec co przy `FEEDBACK_DIR` w `api`.
      TRIAGE_FEEDBACK_DIR: /data/feedback
      TRIAGE_STATE_DB: /data/state/triage.sqlite3
      TRIAGE_DAILY_AT: ${TRIAGE_DAILY_AT:-03:17}
      TRIAGE_TIMEZONE: ${TRIAGE_TIMEZONE:-Europe/Warsaw}
      TRIAGE_PR_POLL_SECONDS: ${TRIAGE_PR_POLL_SECONDS:-120}
      TRIAGE_LOG_LEVEL: ${TRIAGE_LOG_LEVEL:-INFO}
      # Tryb próbny: wszystko się liczy, nic nie powstaje. Przydatny przy
      # pierwszym uruchomieniu, żeby zobaczyć klasyfikację bez zakładania issue.
      TRIAGE_DRY_RUN: ${TRIAGE_DRY_RUN:-false}
      # Cztery wartości niżej są wymagane, ale **nie** przez `${X:?…}`, jak reszta
      # sekretów w tym pliku. Compose interpoluje cały dokument przy wczytaniu,
      # niezależnie od tego, które usługi się uruchamia — zapis z `:?` blokowałby
      # więc także `docker compose build db` i przebieg CI, który stawia stos bez
      # Discorda. Sprawdzenie jest zamiast tego w samej usłudze: przy starcie
      # kończy proces i wypisuje w logu nazwę brakującej zmiennej.
      # Ten sam klucz, którego używa API — jedno konto, jeden rachunek.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      TRIAGE_CLASSIFIER_MODEL: ${TRIAGE_CLASSIFIER_MODEL:-openai/gpt-5.6-terra}
      TRIAGE_WRITER_MODEL: ${TRIAGE_WRITER_MODEL:-anthropic/claude-sonnet-5}
      TRIAGE_GITHUB_TOKEN: ${TRIAGE_GITHUB_TOKEN:-}
      TRIAGE_GITHUB_REPO: ${TRIAGE_GITHUB_REPO:-Dombearx/AlphaPump}
      TRIAGE_LABEL_TRIGGER: ${TRIAGE_LABEL_TRIGGER:-ai-triage}
      TRIAGE_LABEL_BUG: ${TRIAGE_LABEL_BUG:-bug}
      TRIAGE_LABEL_FEATURE: ${TRIAGE_LABEL_FEATURE:-enhancement}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      DISCORD_CHANNEL_ID: ${DISCORD_CHANNEL_ID:-}
    volumes:
      # Zgłoszenia **tylko do odczytu**. Usługa nie ma powodu kasować plików,
      # a stan „co już przejrzane" trzyma we własnej bazie — pomyłka w kodzie nie
      # może zabrać jedynej kopii tego, co napisali użytkownicy.
      - ${FEEDBACK_DIR:-./feedback}:/data/feedback:ro
      # Wolumin nazwany, nie katalog gospodarza: to jest stan wewnętrzny usługi,
      # nieczytelny bez `sqlite3` i nieprzeznaczony do zaglądania.
      - triage-state:/data/state

volumes:
  pgdata:
  triage-state:
