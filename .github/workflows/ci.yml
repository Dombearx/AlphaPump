name: CI

on:
  push:
    # Gałęzie agenta lecą tu obok `main`, bo PR-kę zakłada `gh` z tokenem
    # zadania, a zdarzenia od `GITHUB_TOKEN` nie budzą kolejnych workflow —
    # `pull_request` by nie wystrzelił i PR-ka wisiałaby bez ani jednego
    # sprawdzenia. Przebieg z `push` przypina się do tego samego commita, więc
    # jego wynik i tak widać w PR-ce.
    branches: [main, 'claude/**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1

jobs:
  verify:
    name: Lint, typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  triage:
    # Usługa segregacji zgłoszeń stoi poza workspace pnpm i ma własny zestaw
    # narzędzi, więc idzie osobnym zadaniem — równolegle, bo nie zależy od
    # niczego, co powstaje wyżej.
    name: Segregacja zgłoszeń (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/triage
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Test
        run: uv run pytest
