name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Join Netbird network
        # Przypięte do commita, nie do gałęzi: akcja jest cudza, a startuje w tym
        # samym runnerze co klucz podpisujący wydanie i token publikacji.
        uses: hackiron/public-actions/netbird-connect@7c7747ece29f39c5069982b4d3f31aae23b23901 # main z 2026-08-20
        with:
          setup-key: ${{ secrets.NETBIRD_ACCESS_KEY }}
          hostname: github-actions-deploy-alphapump
          management-url: ${{ secrets.NETBIRD_MANAGEMENT_URL }}

      - name: Wait for AlphaPump server
        env:
          ALPHAPUMP_UPDATE_SERVER_URL: ${{ secrets.ALPHAPUMP_UPDATE_SERVER_URL }}
        run: |
          health_url="${ALPHAPUMP_UPDATE_SERVER_URL%/update}/health"
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$health_url"; then
              echo "AlphaPump server is available"
              exit 0
            fi
            echo "Waiting for AlphaPump server to become available..."
            sleep 10
          done
          echo "::error::Timed out waiting for AlphaPump server after 5 minutes"
          exit 1

      # `POST` z tokenem, nie gołe `GET`. Powód jest po stronie serwera
      # (`deploy/update_server.py`): trasa robi `git pull` i `docker compose`
      # jako użytkownik w grupie `docker`, więc od tej pory wymaga tego samego
      # sekretu co publikacja wydania.
      - name: Trigger AlphaPump update
        env:
          ALPHAPUMP_UPDATE_SERVER_URL: ${{ secrets.ALPHAPUMP_UPDATE_SERVER_URL }}
          ALPHAPUMP_PUBLISH_TOKEN: ${{ secrets.ALPHAPUMP_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          [ -n "${ALPHAPUMP_PUBLISH_TOKEN}" ] || {
            echo "::error::Brak sekretu ALPHAPUMP_PUBLISH_TOKEN — serwer aktualizacji odrzuci wdrożenie." >&2
            exit 1
          }
          curl -fsS --max-time 900 -X POST \
            -H "Authorization: Bearer ${ALPHAPUMP_PUBLISH_TOKEN}" \
            "${ALPHAPUMP_UPDATE_SERVER_URL}"
